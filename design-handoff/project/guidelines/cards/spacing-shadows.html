<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows" subtitle="Warm-tinted elevation; green lift on hover" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-page); padding:28px; display:flex; gap:26px; align-items:center; flex-wrap:wrap; }
  .item { text-align:center; }
  .box { width:120px; height:78px; background:var(--fei-white); border-radius:var(--radius-lg); border:1px solid var(--border-default); }
  .t { font-size:12px; font-weight:600; margin-top:12px; color:var(--text-body); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="t">sm</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-card)"></div><div class="t">card</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lift)"></div><div class="t">lift</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-green)"></div><div class="t">green hover</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sticky)"></div><div class="t">sticky</div></div>
</body>
</html>

<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&#34;Anthropic Sans&#34;, -apple-system, &#34;system-ui&#34;, &#34;Segoe UI&#34;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Drei Icons: Photovoltaik, Elektromobilität, Energiekreislauf</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&#34;Anthropic Sans&#34;, -apple-system, &#34;system-ui&#34;, &#34;Segoe UI&#34;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Drei flache Vektor-Illustrationen für die fei Bürgerenergie eG: links eine Photovoltaikanlage auf grüner Wiese mit Sonne und Wolken; mittig ein weißes Elektroauto an einer grünen Ladesäule; rechts ein grünes Recycling-Symbol aus zwei Pfeilen mit einem gelben Blitz in der Mitte.</desc>


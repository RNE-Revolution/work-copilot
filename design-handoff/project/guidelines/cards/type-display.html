<!-- @dsCard group="Type" viewport="700x260" name="Display Scale — Inter" subtitle="One typeface. Bold/Black, headlines often italic, tight tracking" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-page); padding:24px; color:var(--text-body); }
  .item { font-family:var(--font-display); font-weight:900; line-height:1.0; margin:0 0 14px; letter-spacing:var(--tracking-display); }
  .meta { font-family:var(--font-body); font-size:11px; color:var(--text-muted); font-weight:600; display:block; letter-spacing:.04em; font-style:normal; }
  .hero { font-size:56px; font-style:italic; }
  .display { font-size:40px; font-weight:800; }
  .title { font-size:28px; font-weight:700; font-style:italic; }
</style>
</head>
<body>
  <p class="hero item">Energiewende<span class="meta">Hero · clamp(2.8–5.5rem) · Inter 900 Italic</span></p>
  <p class="display item">Regionale Wertschöpfung<span class="meta">Display H2 · clamp(2–3rem) · Inter 800</span></p>
  <p class="title item">Kontakt aufnehmen<span class="meta">Title H3 · clamp(1.5–2.25rem) · Inter 700 Italic</span></p>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-page); padding:20px; display:flex; gap:18px; align-items:stretch; }
  .panel { background:var(--fei-white); border:1px solid var(--border-default); border-radius:var(--radius-lg); padding:18px; display:flex; align-items:center; justify-content:center; }
  .ill { flex:1; }
  .ill img { width:100%; max-height:180px; object-fit:contain; }
  .qr { width:180px; flex-direction:column; gap:10px; }
  .qr img { width:120px; height:120px; }
  .cap { font-size:11px; color:var(--text-muted); font-weight:600; }
</style>
</head>
<body>
  <div class="panel ill"><img src="../../assets/brand/drei-icons-pv-emobility-kreislauf.svg" alt="PV, E-Mobilität, Energiekreislauf"></div>
  <div class="panel qr"><img src="../../assets/brand/linktree-qr.png" alt="Linktree QR"><span class="cap">Linktree QR</span></div>
</body>
</html>

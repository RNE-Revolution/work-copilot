<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card-Surface — Vergleich</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; }
  body { background: #FFFFFF; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .doc { max-width: 1040px; margin: 0 auto; padding: 28px 24px 36px; }
  .doc-head { margin: 0 0 22px; }
  .doc-eyebrow { font-family: var(--font-body); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--action-primary); margin: 0 0 6px; }
  .doc-title { font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1.05; color: var(--text-body); margin: 0 0 8px; }
  .doc-sub { font-family: var(--font-body); font-size: 14px; line-height: 1.5; color: var(--text-secondary); margin: 0; max-width: 70ch; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .tile { break-inside: avoid; }
  .tile-label { font-family: var(--font-body); font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--text-body); margin: 0 0 10px; }

  .note { margin-top: 26px; padding: 16px 18px; border-radius: var(--radius-lg);
    background: var(--surface-feature-soft); border: 1px solid var(--fei-green);
    font-family: var(--font-body); font-size: 13.5px; line-height: 1.55; color: var(--text-body); break-inside: avoid; }
  .note strong { color: var(--fei-green-700); }

  @page { size: A4 landscape; margin: 0.9cm; }
  @media print {
    .tile, .note, .doc-head { break-inside: avoid; }
    *, *::before, *::after {
      animation-delay: -99s !important; animation-duration: .001s !important;
      animation-iteration-count: 1 !important; animation-fill-mode: both !important;
      animation-play-state: running !important; transition-duration: 0s !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const ICON = 'assets/icons/solar-panel.gif';

function Eyebrow({ children, color = 'var(--action-primary)' }) {
  return <p style={{
    fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', fontWeight: 600,
    textTransform: 'uppercase', letterSpacing: 'var(--tracking-eyebrow)',
    color, margin: '0 0 6px',
  }}>{children}</p>;
}

function YellowPill({ children }) {
  return <span style={{
    display: 'inline-block', background: 'var(--fei-yellow)', color: 'var(--text-on-yellow)',
    fontFamily: 'var(--font-body)', fontSize: '0.6875rem', fontWeight: 700,
    textTransform: 'uppercase', letterSpacing: '0.06em', padding: '5px 11px',
    borderRadius: 'var(--radius-pill)',
  }}>{children}</span>;
}

function GreenLink() {
  return <span style={{
    display: 'inline-flex', alignItems: 'center', gap: '0.4rem',
    fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 600,
    color: 'var(--action-primary)',
  }}>
    Mehr erfahren
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
      <path strokeLinecap="round" strokeLinejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
    </svg>
  </span>;
}

function FullCard({ surface }) {
  return (
    <div style={{
      position: 'relative', display: 'flex', flexDirection: 'column',
      borderRadius: 'var(--radius-lg)', padding: 'var(--space-6)', minHeight: 300,
      fontFamily: 'var(--font-body)', ...surface,
    }}>
      <div style={{ position: 'absolute', top: 'var(--space-5)', right: 'var(--space-5)' }}>
        <YellowPill>Gefördert</YellowPill>
      </div>
      <img src={ICON} alt="" width="56" height="56" style={{ display: 'block', marginBottom: 'var(--space-4)' }} />
      <Eyebrow>Leistung</Eyebrow>
      <h3 style={{
        fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '1.6rem',
        color: 'var(--text-body)', lineHeight: 'var(--leading-snug)', margin: '0 0 0.5rem',
      }}>Mieterstrom</h3>
      <p style={{
        color: 'var(--text-secondary)', lineHeight: 'var(--leading-relaxed)',
        margin: '0 0 var(--space-5)', fontSize: 'var(--text-base)',
      }}>Solaranlage aufs Dach, Strom direkt zu den Mietern — ohne Netzgebühren.</p>
      <div style={{
        display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
        gap: 'var(--space-4)', marginTop: 'auto',
        paddingTop: 'var(--space-5)', borderTop: '1px solid var(--border-default)',
      }}>
        <div>
          <div style={{
            fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: '2rem',
            lineHeight: 1, color: 'var(--accent-display)', letterSpacing: 'var(--tracking-tight)',
          }}>257<span style={{ fontSize: '0.5em', marginLeft: '0.25rem', fontWeight: 700 }}>kWp</span></div>
          <div style={{ marginTop: '0.3rem', fontSize: 'var(--text-xs)', color: 'var(--text-muted)' }}>installiert</div>
        </div>
        <GreenLink />
      </div>
    </div>
  );
}

function SparseCard() {
  return (
    <div style={{
      fontFamily: 'var(--font-body)', padding: 'var(--space-2) 0', minHeight: 300,
      borderTop: '2px solid var(--fei-navy)',
    }}>
      <div style={{ paddingTop: 'var(--space-5)' }}>
        <Eyebrow>Leistung</Eyebrow>
        <h3 style={{
          fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '1.6rem',
          color: 'var(--text-body)', lineHeight: 'var(--leading-snug)', margin: '0 0 0.6rem',
        }}>Mieterstrom</h3>
        <p style={{
          color: 'var(--text-secondary)', lineHeight: 'var(--leading-relaxed)',
          margin: '0 0 var(--space-6)', fontSize: 'var(--text-base)',
        }}>Solaranlage aufs Dach, Strom direkt zu den Mietern — ohne Netzgebühren.</p>
        <span style={{
          display: 'inline-flex', alignItems: 'center', gap: '0.4rem',
          fontSize: 'var(--text-sm)', fontWeight: 600, color: 'var(--accent-display)',
        }}>
          Mehr erfahren
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
          </svg>
        </span>
      </div>
    </div>
  );
}

function Verdict({ tone, children }) {
  const c = tone === 'good' ? 'var(--fei-green-700)' : tone === 'bad' ? 'var(--fei-warning)' : 'var(--text-muted)';
  return <p style={{
    fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', lineHeight: 1.5,
    color: c, margin: '14px 0 0', display: 'flex', gap: '0.45rem', alignItems: 'baseline',
  }}>
    <span style={{ fontWeight: 700 }}>{tone === 'good' ? '✓' : tone === 'bad' ? '✕' : '·'}</span>
    <span>{children}</span>
  </p>;
}

function Tile({ label, children }) {
  return (
    <div className="tile">
      <p className="tile-label">{label}</p>
      {children}
    </div>
  );
}

function PrintDoc() {
  return (
    <div className="doc">
      <div className="doc-head">
        <p className="doc-eyebrow">Design-Entscheidung · Surfaces</p>
        <h1 className="doc-title">Card-Surface — Vergleich</h1>
        <p className="doc-sub">Gleiche Card auf weißer Page · Grün + Gelb + Lila als Test — welcher Untergrund lässt die Akzente am besten kommen?</p>
      </div>

      <div className="grid">
        <Tile label="A · Cream Soft (aktuell)">
          <FullCard surface={{ background: 'var(--fei-cream-soft)', border: '1px solid var(--border-default)' }} />
          <Verdict tone="neutral">Warm &amp; freundlich, aber der warme Cremeton beißt sich leicht mit dem kühlen Lila — und auf weißer Page wirkt zusätzliche Tönung schnell „zu viel".</Verdict>
        </Tile>

        <Tile label="B · Weiß + Hairline">
          <FullCard surface={{ background: '#FFFFFF', border: '1px solid rgba(15,23,42,0.10)' }} />
          <Verdict tone="good">Neutral &amp; ruhig. Die kühle Haarlinie trennt sauber von der Page, Grün / Gelb / Lila poppen ohne Konkurrenz. Sehr „cooperative-editorial".</Verdict>
        </Tile>

        <Tile label="C · Weiß + Soft Shadow">
          <FullCard surface={{ background: '#FFFFFF', border: '1px solid rgba(15,23,42,0.04)', boxShadow: 'var(--shadow-card)' }} />
          <Verdict tone="good">Schwebend &amp; modern. Tiefe ohne Farbe — die Card hebt sich rein über Licht/Schatten ab, Akzente bleiben die einzigen Farbträger.</Verdict>
        </Tile>

        <Tile label="D · Lavendel">
          <FullCard surface={{ background: 'var(--fei-lavender)', border: '1px solid var(--fei-lila)' }} />
          <Verdict tone="bad">Lila wird zur Fläche → der Lila-Stat verliert seinen Pop (gleiche Familie), und das warme Gelb wirkt auf kühlem Lavendel leicht schmutzig.</Verdict>
        </Tile>

        <Tile label="E · Sparsam (kein Container)">
          <SparseCard />
          <Verdict tone="good">„Weniger ist mehr": kein Kasten, viel Luft, max. zwei Akzente (Navy-Regel + Lila-Link). Wirkt am hochwertigsten — braucht aber klares Layout-Raster.</Verdict>
        </Tile>
      </div>

      <div className="note">
        <strong>Empfehlung:</strong> B (Weiß + Hairline) oder C (Weiß + Soft Shadow) — weiße Cards lassen Grün / Gelb / Lila als einzige Farbträger wirken. Lavendel besser nur als kleiner Tint (Chips, Wash, Hover), nicht als Card-Fläche.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PrintDoc />);

// Auto-print once fonts, the icon image, and layout have settled.
(function () {
  function waitImages() {
    const imgs = Array.from(document.images || []);
    return Promise.all(imgs.map(img => img.complete ? Promise.resolve()
      : new Promise(res => { img.addEventListener('load', res); img.addEventListener('error', res); })));
  }
  const fonts = document.fonts ? document.fonts.ready : Promise.resolve();
  Promise.all([fonts, waitImages()]).then(() => setTimeout(() => window.print(), 600));
})();
</script>
</body>
</html>

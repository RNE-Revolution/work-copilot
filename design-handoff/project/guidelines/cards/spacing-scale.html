<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4 → 96px rhythm; 24px standard gutter" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-page); padding:24px; color:var(--text-body); }
  .scale { display:flex; align-items:flex-end; gap:16px; }
  .item { text-align:center; }
  .bar { background:var(--fei-green); border-radius:4px; width:28px; }
  .n { font-size:11px; color:var(--text-muted); margin-top:6px; font-variant-numeric:tabular-nums; }
  .t { font-size:11px; font-weight:600; }
</style>
</head>
<body>
  <div class="scale">
    <div class="item"><div class="bar" style="height:4px"></div><div class="t">1</div><div class="n">4px</div></div>
    <div class="item"><div class="bar" style="height:8px"></div><div class="t">2</div><div class="n">8</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="t">3</div><div class="n">12</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="t">4</div><div class="n">16</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="t">5</div><div class="n">24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="t">6</div><div class="n">32</div></div>
    <div class="item"><div class="bar" style="height:40px"></div><div class="t">7</div><div class="n">40</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="t">8</div><div class="n">48</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="t">10</div><div class="n">64</div></div>
    <div class="item"><div class="bar" style="height:80px"></div><div class="t">12</div><div class="n">80</div></div>
    <div class="item"><div class="bar" style="height:96px"></div><div class="t">16</div><div class="n">96</div></div>
  </div>
</body>
</html>

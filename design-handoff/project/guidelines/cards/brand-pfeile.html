<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-page); padding:20px; display:grid; grid-template-columns:repeat(6,1fr); gap:12px; height:200px; box-sizing:border-box; }
  .c { background:var(--fei-white); border:1px solid var(--border-default); border-radius:var(--radius-lg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:14px; box-sizing:border-box; }
  .c img { height:110px; width:100%; object-fit:contain; }
  .cap { font-size:10px; font-weight:600; color:var(--text-muted); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="c"><img src="../../assets/elements/pfeil-1.svg" alt=""><span class="cap">pfeil-1</span></div>

</html>

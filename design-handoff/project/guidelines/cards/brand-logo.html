<!-- @dsCard group="Brand" viewport="700x300" name="Logo" subtitle="Hauptlogo, Weiß auf dunkel, Lokalgruppen Bamberg & Würzburg" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-page); padding:20px; display:grid; grid-template-columns:1.4fr 1fr 1fr; grid-template-rows:1fr 1fr; gap:14px; height:260px; box-sizing:border-box; }
  .p { border-radius:var(--radius-lg); display:flex; align-items:center; justify-content:center; padding:22px; box-sizing:border-box; position:relative; }
  .p img { width:100%; height:100%; object-fit:contain; }
  .light { background:var(--fei-white); border:1px solid var(--border-default); }
  .dark { background:var(--fei-black); }
  .violet { background:var(--fei-violet); }
  .main { grid-row:1 / 3; }
  .cap { position:absolute; left:12px; bottom:8px; font-size:10px; font-weight:600; color:var(--text-muted); letter-spacing:.04em; }
  .dark .cap, .violet .cap { color:rgba(255,255,255,.7); }
</style>
</head>
<body>
  <div class="p light main"><img src="../../assets/brand/logo.svg" alt="fei"><span class="cap">logo.svg — Hauptlogo</span></div>
  <div class="p dark"><img src="../../assets/brand/logo-weiss.svg" alt="fei weiß"><span class="cap">logo-weiss.svg</span></div>
  <div class="p light"><img src="../../assets/brand/logo-bamberg.svg" alt="fei Bamberg"><span class="cap">logo-bamberg.svg</span></div>
  <div class="p violet"><img src="../../assets/brand/logo-weiss-wuerzburg.svg" alt="fei Würzburg"><span class="cap">logo-weiss-wuerzburg.svg</span></div>
  <div class="p light"><img src="../../assets/brand/logo-wuerzburg.svg" alt="fei Würzburg"><span class="cap">logo-wuerzburg.svg</span></div>
</body>
</html>

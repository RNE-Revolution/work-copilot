<!-- @dsCard group="Components" viewport="700x880" name="Core" subtitle="Buttons, tags, badges, cards, stats, inputs, accordion, brand icons" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-page); color:var(--text-body); padding:26px; }
  .group { margin-bottom:26px; }
  .glabel { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--text-muted); margin:0 0 12px; }
  .rowflex { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .arrow { width:18px; height:18px; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>

  <script type="text/babel">
    const { Button, Tag, Badge, Eyebrow, Card, ServiceCard, StatBlock, BrandIcon, Input, Accordion, Avatar } = window.FeiBRgerenergieDesignSystem_019dfe;

    const Arrow = () => (
      <svg className="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
    );

    function Group({ label, children }) {
      return <div className="group"><p className="glabel">{label}</p>{children}</div>;
    }

    function Demo() {
      return (
        <div>
          <Group label="Buttons">
            <div className="rowflex">
              <Button variant="primary" iconRight={<Arrow/>}>Mitglied werden</Button>
              <Button variant="highlight">Projekt anfragen</Button>
              <Button variant="secondary">Mehr erfahren</Button>
              <Button variant="ghost">Details</Button>
              <Button variant="primary" disabled>Gesendet</Button>
            </div>
          </Group>

          <Group label="Tags & Badges">
            <div className="rowflex">
              <Tag>Mieterstrom</Tag>
              <Tag variant="solid">Neu</Tag>
              <Tag variant="outline">GGV</Tag>
              <Tag variant="neutral">Freiflächen-PV</Tag>
              <Badge tone="success" dot>Bestätigt</Badge>
              <Badge tone="warning">Achtung</Badge>
              <Badge tone="neutral">Neutral</Badge>
            </div>
          </Group>

          <Group label="Stat blocks">
            <div className="rowflex" style={{gap:'40px'}}>
              <StatBlock value="380" unit="+" label="Mitglieder" accent="lila" />
              <StatBlock value="257" unit="kWp" label="Installiert" sub="4 Projekte" accent="green" />
              <StatBlock value="142" unit="t" label="CO₂ gespart" accent="yellow" />
            </div>
          </Group>

          <Group label="Service cards">
            <div className="grid2">
              <ServiceCard icon="solar-panel" iconBase="../../assets/icons" title="Mieterstrom" href="#" accent="green">
                Solaranlage aufs Dach, Strom direkt zu den Mietern – ohne Netzgebühren.
              </ServiceCard>
              <ServiceCard icon="electric-car" iconBase="../../assets/icons" title="Ladesäulen" href="#" surface="feature-deep">
                Ladeinfrastruktur für E-Mobilität – in Bürgerhand, regional betrieben.
              </ServiceCard>
            </div>
          </Group>

          <Group label="Inputs">
            <div className="grid2">
              <Input label="E-Mail" type="email" placeholder="name@beispiel.de" required />
              <Input label="PLZ" error="Pflichtfeld" placeholder="96047" />
            </div>
          </Group>

          <Group label="Accordion · Avatar · Brand icons">
            <div className="grid2" style={{alignItems:'start'}}>
              <Card padding="var(--space-5)">
                <Accordion defaultOpen={0} items={[
                  { q: 'Was ist GGV?', a: 'Gemeinschaftliche Gebäudeversorgung – eine Anlage versorgt mehrere Wohneinheiten.' },
                  { q: 'Wer kann mitmachen?', a: 'WEGs und Eigentümergemeinschaften.' },
                ]} />
              </Card>
              <div>
                <div className="rowflex" style={{marginBottom:'14px'}}>
                  <Avatar initials="MK" />
                  <Avatar initials="JS" tone="lila" />
                  <Avatar initials="AB" tone="navy" />
                </div>
                <div className="rowflex">
                  <BrandIcon name="growing-plant" base="../../assets/icons" framed />
                  <BrandIcon name="dividends" base="../../assets/icons" framed />
                  <BrandIcon name="recycling" base="../../assets/icons" framed />
                </div>
              </div>
            </div>
          </Group>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>

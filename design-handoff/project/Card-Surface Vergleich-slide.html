<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card-Surface — Vergleich (Slide)</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; background: #2A2E33; height: 100%; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
  .slide { width: 1920px; height: 1080px; background: #FFFFFF; transform-origin: center center; overflow: hidden; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
</style>
</head>
<body>
<div id="stage"><div class="slide" id="slide"><div id="root"></div></div></div>
<script type="text/babel">
const ICON = 'assets/icons/solar-panel.gif';

function Eyebrow({ children }) {
  return <p style={{
    fontFamily: 'var(--font-body)', fontSize: 13, fontWeight: 600,
    textTransform: 'uppercase', letterSpacing: '0.1em',
    color: 'var(--action-primary)', margin: '0 0 7px',
  }}>{children}</p>;
}

function YellowPill({ children }) {
  return <span style={{
    display: 'inline-block', background: 'var(--fei-yellow)', color: 'var(--text-on-yellow)',
    fontFamily: 'var(--font-body)', fontSize: 11, fontWeight: 700,
    textTransform: 'uppercase', letterSpacing: '0.06em', padding: '5px 11px',
    borderRadius: 'var(--radius-pill)',
  }}>{children}</span>;
}

function GreenLink() {
  return <span style={{
    display: 'inline-flex', alignItems: 'center', gap: '0.4rem',
    fontFamily: 'var(--font-body)', fontSize: 14, fontWeight: 600,
    color: 'var(--action-primary)',
  }}>
    Mehr erfahren
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
      <path strokeLinecap="round" strokeLinejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
    </svg>
  </span>;
}

function FullCard({ surface }) {
  return (
    <div style={{
      position: 'relative', display: 'flex', flexDirection: 'column',
      borderRadius: 'var(--radius-lg)', padding: 26, minHeight: 470,
      fontFamily: 'var(--font-body)', ...surface,
    }}>
      <div style={{ position: 'absolute', top: 22, right: 22 }}>
        <YellowPill>Gefördert</YellowPill>
      </div>
      <img src={ICON} alt="" width="52" height="52" style={{ display: 'block', marginBottom: 18 }} />
      <Eyebrow>Leistung</Eyebrow>
      <h3 style={{
        fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 27,
        color: 'var(--text-body)', lineHeight: 1.15, margin: '0 0 9px',
      }}>Mieterstrom</h3>
      <p style={{
        color: 'var(--text-secondary)', lineHeight: 1.65,
        margin: '0 0 22px', fontSize: 15,
      }}>Solaranlage aufs Dach, Strom direkt zu den Mietern — ohne Netzgebühren.</p>
      <div style={{
        display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
        gap: 12, marginTop: 'auto', paddingTop: 22, borderTop: '1px solid var(--border-default)',
      }}>
        <div>
          <div style={{
            fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: 34,
            lineHeight: 1, color: 'var(--accent-display)', letterSpacing: '-0.01em',
          }}>257<span style={{ fontSize: '0.5em', marginLeft: '0.25rem', fontWeight: 700 }}>kWp</span></div>
          <div style={{ marginTop: 5, fontSize: 12, color: 'var(--text-muted)' }}>installiert</div>
        </div>
        <GreenLink />
      </div>
    </div>
  );
}

function SparseCard() {
  return (
    <div style={{ fontFamily: 'var(--font-body)', minHeight: 470, borderTop: '2px solid var(--fei-navy)' }}>
      <div style={{ paddingTop: 24 }}>
        <Eyebrow>Leistung</Eyebrow>
        <h3 style={{
          fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 27,
          color: 'var(--text-body)', lineHeight: 1.15, margin: '0 0 11px',
        }}>Mieterstrom</h3>
        <p style={{
          color: 'var(--text-secondary)', lineHeight: 1.65,
          margin: '0 0 28px', fontSize: 15,
        }}>Solaranlage aufs Dach, Strom direkt zu den Mietern — ohne Netzgebühren.</p>
        <span style={{
          display: 'inline-flex', alignItems: 'center', gap: '0.4rem',
          fontSize: 14, fontWeight: 600, color: 'var(--accent-display)',
        }}>
          Mehr erfahren
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
          </svg>
        </span>
      </div>
    </div>
  );
}

function Verdict({ tone, children }) {
  const c = tone === 'good' ? 'var(--fei-green-700)' : tone === 'bad' ? 'var(--fei-warning)' : 'var(--text-muted)';
  return <p style={{
    fontFamily: 'var(--font-body)', fontSize: 12.5, lineHeight: 1.5,
    color: c, margin: '13px 0 0', display: 'flex', gap: '0.4rem', alignItems: 'baseline',
  }}>
    <span style={{ fontWeight: 700 }}>{tone === 'good' ? '✓' : tone === 'bad' ? '✕' : '·'}</span>
    <span>{children}</span>
  </p>;
}

function Tile({ label, children }) {
  return (
    <div>
      <p style={{ fontFamily: 'var(--font-body)', fontSize: 12.5, fontWeight: 700, letterSpacing: '0.04em', color: 'var(--text-body)', margin: '0 0 11px' }}>{label}</p>
      {children}
    </div>
  );
}

function Slide() {
  return (
    <div style={{ width: '100%', height: '100%', boxSizing: 'border-box', padding: '60px 80px', display: 'flex', flexDirection: 'column' }}>
      <div style={{ marginBottom: 30 }}>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 14, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--action-primary)', margin: '0 0 9px' }}>Design-Entscheidung · Surfaces</p>
        <h1 style={{ fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: 52, lineHeight: 1.02, color: 'var(--text-body)', margin: '0 0 10px' }}>Card-Surface — Vergleich</h1>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 17, lineHeight: 1.45, color: 'var(--text-secondary)', margin: 0, maxWidth: '90ch' }}>Gleiche Card auf weißer Page · Grün + Gelb + Lila als Test — welcher Untergrund lässt die Akzente am besten kommen?</p>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 24, alignItems: 'start' }}>
        <Tile label="A · Cream Soft (aktuell)">
          <FullCard surface={{ background: 'var(--fei-cream-soft)', border: '1px solid var(--border-default)' }} />
          <Verdict tone="neutral">Warm, aber beißt sich mit dem kühlen Lila — auf weißer Page wirkt Tönung schnell „zu viel".</Verdict>
        </Tile>
        <Tile label="B · Weiß + Hairline">
          <FullCard surface={{ background: '#FFFFFF', border: '1px solid rgba(15,23,42,0.10)' }} />
          <Verdict tone="good">Neutral &amp; ruhig. Akzente poppen ohne Konkurrenz. Sehr „cooperative-editorial".</Verdict>
        </Tile>
        <Tile label="C · Weiß + Soft Shadow">
          <FullCard surface={{ background: '#FFFFFF', border: '1px solid rgba(15,23,42,0.04)', boxShadow: 'var(--shadow-card)' }} />
          <Verdict tone="good">Schwebend &amp; modern. Tiefe ohne Farbe — Akzente bleiben die einzigen Farbträger.</Verdict>
        </Tile>
        <Tile label="D · Lavendel">
          <FullCard surface={{ background: 'var(--fei-lavender)', border: '1px solid var(--fei-lila)' }} />
          <Verdict tone="bad">Lila wird Fläche → der Lila-Stat verliert Pop; Gelb wirkt auf Lavendel schmutzig.</Verdict>
        </Tile>
        <Tile label="E · Sparsam">
          <SparseCard />
          <Verdict tone="good">„Weniger ist mehr": kein Kasten, viel Luft, max. zwei Akzente. Wirkt am hochwertigsten.</Verdict>
        </Tile>
      </div>

      <div style={{ marginTop: 'auto', paddingTop: 22, fontFamily: 'var(--font-body)', fontSize: 15, lineHeight: 1.5, color: 'var(--text-body)' }}>
        <strong style={{ color: 'var(--fei-green-700)' }}>Empfehlung:</strong> B (Weiß + Hairline) oder C (Weiß + Soft Shadow) — weiße Cards lassen Grün / Gelb / Lila als einzige Farbträger wirken. Lavendel besser nur als kleiner Tint (Chips, Wash, Hover), nicht als Card-Fläche.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
<script>
  function fitSlide() {
    const s = document.getElementById('slide');
    if (!s) return;
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    s.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitSlide);
  fitSlide();
</script>
</body>
</html>

<!-- @dsCard group="Brand" viewport="700x260" name="Blitz & Bubbles" subtitle="Outline-Blitz hinter Titeln, Aufruf-Bubble, Foto-Bubble in einer unteren Ecke" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-page); padding:20px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; height:220px; box-sizing:border-box; color:var(--text-body); }
  .c { background:var(--fei-white); border:1px solid var(--border-default); border-radius:var(--radius-lg); position:relative; overflow:hidden; }
  .cap { position:absolute; left:12px; bottom:8px; font-size:10px; font-weight:600; color:var(--text-muted); letter-spacing:.04em; z-index:2; }
  .foto .cap { bottom:auto; top:10px; }
  .blitz img { position:absolute; left:50%; top:50%; height:180px; transform:translate(-50%,-52%); }
  .blitz h3 { position:relative; margin:0; text-align:center; top:50%; transform:translateY(-50%); font-family:var(--font-display); font-weight:900; font-style:italic; font-size:34px; letter-spacing:var(--tracking-display); color:var(--fei-violet); }
  .bubble { display:flex; align-items:center; justify-content:center; }
  .bubble .wrap { position:relative; width:170px; height:161px; }
  .bubble img { width:100%; height:100%; display:block; }
  .bubble p { position:absolute; inset:0 0 14% 0; margin:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 26px; font-weight:700; font-style:italic; font-size:17px; line-height:var(--leading-bubble); color:var(--fei-black); }
  .foto img { position:absolute; right:-40px; bottom:-60px; width:190px; height:190px; }
  .foto .tint { position:absolute; right:-40px; bottom:-60px; width:190px; height:190px; border-radius:50%; background:var(--fei-violet); overflow:hidden; }
  .foto .tint img { position:static; width:100%; height:100%; object-fit:cover; filter:grayscale(1); mix-blend-mode:screen; opacity:.85; }
</style>
</head>
<body>
  <div class="c blitz"><img src="../../assets/elements/blitz.svg" alt=""><h3>Titel</h3><span class="cap">blitz.svg — hinter Titel, nur Umriss</span></div>
  <div class="c bubble"><div class="wrap"><img src="../../assets/elements/aufruf-bubble.svg" alt=""><p>Jetzt Mitglied werden!</p></div><span class="cap">aufruf-bubble.svg — Bold Italic, 90 %</span></div>
  <div class="c foto"><div class="tint"><img src="../../assets/img/solar-two-buildings.png" alt=""></div><span class="cap">foto-bubble.svg — Foto violett eingefärbt</span></div>
</body>
</html>

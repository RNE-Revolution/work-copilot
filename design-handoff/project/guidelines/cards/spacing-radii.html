<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="8 → 24px and full pill" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-page); padding:24px; display:flex; gap:18px; align-items:center; }
  .item { text-align:center; }
  .box { width:84px; height:64px; background:var(--fei-cream-mid); border:2px solid var(--fei-green); }
  .pill { width:110px; height:44px; border-radius:9999px; background:var(--fei-green); }
  .t { font-size:12px; font-weight:600; margin-top:8px; color:var(--text-body); }
  .n { font-size:11px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="t">sm</div><div class="n">8px</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="t">md</div><div class="n">12px</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="t">lg · cards</div><div class="n">16px</div></div>
  <div class="item"><div class="box" style="border-radius:24px"></div><div class="t">xl · sticky</div><div class="n">24px</div></div>
  <div class="item"><div class="pill"></div><div class="t">pill</div><div class="n">9999px</div></div>
</body>
</html>

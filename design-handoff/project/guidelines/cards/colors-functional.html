<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-page); padding:20px; }

  .sw { flex:1; border-radius:var(--radius-md); height:104px; display:flex; flex-direction:column; justify-content:flex-end; padding:12px; color:#fff; }
  .name { font-size:12px; font-weight:600; }

</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--fei-success)"><span class="name">Success</span><span class="hex">#15803D · Bestätigung</span></div>

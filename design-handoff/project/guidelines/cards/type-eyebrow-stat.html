<!-- @dsCard group="Type" viewport="700x150" name="Eyebrow & Stat" subtitle="Uppercase green kicker + big lila figure" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--surface-page); padding:24px; display:flex; gap:48px; align-items:center; }
  .eyebrow { font-size:14px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--action-primary); margin:0 0 8px; }
  .h { font-family:var(--font-display); font-weight:900; font-size:30px; color:var(--text-body); margin:0; line-height:1.1; }
  .stat { font-family:var(--font-display); font-weight:900; font-size:64px; color:var(--accent-display); line-height:1; }
  .unit { font-size:24px; margin-left:4px; }
  .slabel { font-size:13px; color:var(--text-secondary); font-weight:600; margin-top:4px; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">Angebote</p>
    <p class="h">Unsere Energielösungen</p>
  </div>
  <div>
    <div class="stat">257<span class="unit">kWp</span></div>
    <div class="slabel">Installiert · 4 Projekte</div>
  </div>
</body>
</html>
